name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The latest 1.26 patch: 1.26.0 has known stdlib advisories.
          go-version: 1.26.x
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: v2.19.0
      - run: git --version
      - run: make check

  # The docs are the spec: a dead link fails the build.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: make docs
