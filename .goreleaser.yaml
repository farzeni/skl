# GoReleaser config, checked by make check (release-check). A pushed v* tag
# runs it in .github/workflows/release.yml.
version: 2

project_name: skl

builds:
  - main: ./cmd/skl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/farzeni/skl/internal/cli.version={{.Version}}
      - -X github.com/farzeni/skl/internal/cli.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
